<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" fill="none">
  <defs>
    <marker id="pipe-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7DA9E8"/>
    </marker>
    <marker id="vec-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E6AB55"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="#141821"/>
  <rect x="16" y="16" width="848" height="398" rx="14" fill="#1A202C" stroke="#2D3748" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="50" fill="#9EC0F2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1">CHAPTER 5 · ANATOMY OF A GPT TRANSFORMER (NEXT-TOKEN PREDICTION)</text>
  <line x1="40" y1="62" x2="840" y2="62" stroke="#2D3748" stroke-width="1"/>

  <!-- TOP PIPELINE -->
  <!-- Stage 1: Tokens -->
  <rect x="36" y="88" width="122" height="148" rx="10" fill="#141821" stroke="#334155"/>
  <text x="97" y="110" fill="#9EC0F2" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">1. TOKENIZE</text>
  <rect x="50" y="124" width="94" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="97" y="140" fill="#ECEEF2" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">"The"</text>
  <rect x="50" y="156" width="94" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="97" y="172" fill="#ECEEF2" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">"cat"</text>
  <rect x="50" y="188" width="94" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="97" y="204" fill="#ECEEF2" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">"sat"</text>

  <line x1="158" y1="162" x2="180" y2="162" stroke="#7DA9E8" stroke-width="1.8" marker-end="url(#pipe-arr)"/>

  <!-- Stage 2: Embedding -->
  <rect x="184" y="88" width="128" height="148" rx="10" fill="#141821" stroke="#4EC499" stroke-opacity="0.7"/>
  <text x="248" y="110" fill="#4EC499" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">2. EMBED (W_E)</text>
  <text x="248" y="128" fill="#747D8F" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">token + position</text>
  <!-- 3 vector bars -->
  <g transform="translate(206, 140)">
    <rect x="0" y="0" width="22" height="72" rx="4" fill="#1E293B" stroke="#4EC499"/>
    <rect x="4" y="8" width="14" height="10" rx="2" fill="#4EC499" opacity="0.8"/>
    <rect x="4" y="24" width="14" height="10" rx="2" fill="#4EC499" opacity="0.3"/>
    <rect x="4" y="40" width="14" height="10" rx="2" fill="#4EC499" opacity="0.6"/>
    <rect x="4" y="56" width="14" height="10" rx="2" fill="#4EC499" opacity="0.9"/>

    <rect x="31" y="0" width="22" height="72" rx="4" fill="#1E293B" stroke="#4EC499"/>
    <rect x="35" y="8" width="14" height="10" rx="2" fill="#4EC499" opacity="0.4"/>
    <rect x="35" y="24" width="14" height="10" rx="2" fill="#4EC499" opacity="0.9"/>
    <rect x="35" y="40" width="14" height="10" rx="2" fill="#4EC499" opacity="0.7"/>
    <rect x="35" y="56" width="14" height="10" rx="2" fill="#4EC499" opacity="0.25"/>

    <rect x="62" y="0" width="22" height="72" rx="4" fill="#1E293B" stroke="#4EC499"/>
    <rect x="66" y="8" width="14" height="10" rx="2" fill="#4EC499" opacity="0.75"/>
    <rect x="66" y="24" width="14" height="10" rx="2" fill="#4EC499" opacity="0.5"/>
    <rect x="66" y="40" width="14" height="10" rx="2" fill="#4EC499" opacity="0.9"/>
    <rect x="66" y="56" width="14" height="10" rx="2" fill="#4EC499" opacity="0.45"/>
  </g>
  <text x="248" y="228" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">e₁, e₂, e₃ ∈ ℝᵈ</text>

  <line x1="312" y1="162" x2="334" y2="162" stroke="#7DA9E8" stroke-width="1.8" marker-end="url(#pipe-arr)"/>

  <!-- Stage 3: N x Transformer Blocks -->
  <rect x="338" y="82" width="196" height="160" rx="10" fill="#171E2E" stroke="#7DA9E8" stroke-width="1.6"/>
  <text x="436" y="103" fill="#9EC0F2" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">3. L × TRANSFORMER BLOCKS</text>

  <rect x="356" y="116" width="160" height="38" rx="7" fill="#1E293B" stroke="#7DA9E8"/>
  <text x="436" y="133" fill="#ECEEF2" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Multi-Head Attention</text>
  <text x="436" y="147" fill="#9EC0F2" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">tokens exchange context</text>

  <text x="436" y="168" fill="#4EC499" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">+ Residual Stream (E ← E + ΔE)</text>

  <rect x="356" y="176" width="160" height="38" rx="7" fill="#1E293B" stroke="#B195E8"/>
  <text x="436" y="193" fill="#ECEEF2" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">MLP (Feed-Forward)</text>
  <text x="436" y="207" fill="#B195E8" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">per-token facts &amp; features</text>

  <text x="436" y="232" fill="#747D8F" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">Repeated L times (e.g., 96 in GPT-3)</text>

  <line x1="534" y1="162" x2="556" y2="162" stroke="#7DA9E8" stroke-width="1.8" marker-end="url(#pipe-arr)"/>

  <!-- Stage 4: Unembed -->
  <rect x="560" y="88" width="116" height="148" rx="10" fill="#141821" stroke="#E6AB55" stroke-opacity="0.7"/>
  <text x="618" y="110" fill="#E6AB55" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">4. UNEMBED</text>
  <text x="618" y="128" fill="#747D8F" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">last vector h_T</text>
  <rect x="580" y="140" width="76" height="50" rx="6" fill="#1E293B" stroke="#E6AB55"/>
  <text x="618" y="162" fill="#ECEEF2" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" text-anchor="middle">z = W_U h_T</text>
  <text x="618" y="179" fill="#E6AB55" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">logits ∈ ℝ^|V|</text>
  <text x="618" y="216" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">|V| ≈ 50k–150k</text>

  <line x1="676" y1="162" x2="698" y2="162" stroke="#7DA9E8" stroke-width="1.8" marker-end="url(#pipe-arr)"/>

  <!-- Stage 5: Softmax -->
  <rect x="702" y="88" width="142" height="148" rx="10" fill="#141821" stroke="#E37B6B" stroke-opacity="0.75"/>
  <text x="773" y="110" fill="#E37B6B" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">5. SOFTMAX (T)</text>

  <!-- Probability bars -->
  <g transform="translate(714, 128)" font-family="ui-monospace, monospace" font-size="10">
    <text x="0" y="12" fill="#ECEEF2">"on"</text>
    <rect x="46" y="2" width="66" height="12" rx="3" fill="#4EC499"/>
    <text x="0" y="34" fill="#A8B0BF">"down"</text>
    <rect x="46" y="24" width="32" height="12" rx="3" fill="#7DA9E8"/>
    <text x="0" y="56" fill="#A8B0BF">"still"</text>
    <rect x="46" y="46" width="18" height="12" rx="3" fill="#B195E8"/>
    <text x="0" y="78" fill="#747D8F">"..."</text>
    <rect x="46" y="68" width="8" height="12" rx="3" fill="#475569"/>
  </g>
  <text x="773" y="226" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">sample → append loop</text>

  <!-- BOTTOM CALLOUT PANELS -->
  <!-- Left: Embedding Space Geometry -->
  <rect x="36" y="264" width="398" height="132" rx="10" fill="#141821" stroke="#2D3748"/>
  <text x="54" y="286" fill="#4EC499" font-family="ui-monospace, monospace" font-size="11" font-weight="600">EMBEDDING GEOMETRY: DIRECTIONS ENCODE SEMANTICS</text>

  <g transform="translate(64, 304)">
    <!-- Parallelogram -->
    <circle cx="28" cy="64" r="4.5" fill="#7DA9E8"/>
    <text x="16" y="80" fill="#9EC0F2" font-family="ui-monospace, monospace" font-size="10.5">Man</text>

    <circle cx="156" cy="64" r="4.5" fill="#7DA9E8"/>
    <text x="140" y="80" fill="#9EC0F2" font-family="ui-monospace, monospace" font-size="10.5">Woman</text>

    <circle cx="70" cy="14" r="4.5" fill="#E6AB55"/>
    <text x="54" y="6" fill="#E6AB55" font-family="ui-monospace, monospace" font-size="10.5">King</text>

    <circle cx="198" cy="14" r="5" fill="#4EC499"/>
    <text x="184" y="6" fill="#4EC499" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Queen</text>

    <line x1="33" y1="64" x2="149" y2="64" stroke="#E6AB55" stroke-width="1.7" marker-end="url(#vec-arr)"/>
    <line x1="75" y1="14" x2="190" y2="14" stroke="#E6AB55" stroke-width="1.7" marker-end="url(#vec-arr)"/>
    <line x1="30" y1="60" x2="68" y2="18" stroke="#475569" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="158" y1="60" x2="196" y2="18" stroke="#475569" stroke-width="1.3" stroke-dasharray="3 3"/>

    <text x="234" y="28" fill="#ECEEF2" font-family="ui-monospace, monospace" font-size="11">E(Queen) ≈</text>
    <text x="234" y="48" fill="#A8B0BF" font-family="ui-monospace, monospace" font-size="10.5">E(King) − E(Man)</text>
    <text x="234" y="66" fill="#A8B0BF" font-family="ui-monospace, monospace" font-size="10.5">+ E(Woman)</text>
  </g>

  <!-- Right: Softmax Temperature -->
  <rect x="448" y="264" width="396" height="132" rx="10" fill="#141821" stroke="#2D3748"/>
  <text x="466" y="286" fill="#E37B6B" font-family="ui-monospace, monospace" font-size="11" font-weight="600">SOFTMAX WITH TEMPERATURE:  pᵢ = exp(zᵢ/T) / Σ exp(zⱼ/T)</text>

  <!-- T -> 0 -->
  <g transform="translate(470, 304)">
    <text x="46" y="10" fill="#4EC499" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">T = 0.2 (Greedy)</text>
    <line x1="6" y1="64" x2="88" y2="64" stroke="#334155"/>
    <rect x="14" y="18" width="16" height="46" rx="2" fill="#4EC499"/>
    <rect x="38" y="57" width="16" height="7" rx="2" fill="#4EC499" opacity="0.4"/>
    <rect x="62" y="61" width="16" height="3" rx="2" fill="#4EC499" opacity="0.25"/>
    <text x="46" y="80" fill="#747D8F" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">deterministic</text>
  </g>

  <!-- T = 1.0 -->
  <g transform="translate(598, 304)">
    <text x="46" y="10" fill="#7DA9E8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">T = 1.0 (Std)</text>
    <line x1="6" y1="64" x2="88" y2="64" stroke="#334155"/>
    <rect x="14" y="28" width="16" height="36" rx="2" fill="#7DA9E8"/>
    <rect x="38" y="44" width="16" height="20" rx="2" fill="#7DA9E8" opacity="0.7"/>
    <rect x="62" y="54" width="16" height="10" rx="2" fill="#7DA9E8" opacity="0.45"/>
    <text x="46" y="80" fill="#747D8F" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">balanced</text>
  </g>

  <!-- T = 2.0 -->
  <g transform="translate(726, 304)">
    <text x="46" y="10" fill="#E6AB55" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">T = 2.0 (High)</text>
    <line x1="6" y1="64" x2="88" y2="64" stroke="#334155"/>
    <rect x="14" y="40" width="16" height="24" rx="2" fill="#E6AB55"/>
    <rect x="38" y="44" width="16" height="20" rx="2" fill="#E6AB55" opacity="0.8"/>
    <rect x="62" y="48" width="16" height="16" rx="2" fill="#E6AB55" opacity="0.65"/>
    <text x="46" y="80" fill="#747D8F" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">flatter / diverse</text>
  </g>
</svg>
