<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" fill="#141821"/>
  <rect x="24" y="24" width="752" height="352" rx="14" fill="#1A202C" stroke="#2D3748" stroke-width="1.5"/>

  <!-- Left panel: Causal Attention Matrix -->
  <text x="64" y="68" fill="#9EC0F2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1">CAUSAL ATTENTION MASK (T × T)</text>
  <g transform="translate(64, 92)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.92"/>
    <rect x="50" y="0" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <rect x="100" y="0" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <rect x="150" y="0" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <rect x="200" y="0" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <!-- Row 1 -->
    <rect x="0" y="50" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.45"/>
    <rect x="50" y="50" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.82"/>
    <rect x="100" y="50" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <rect x="150" y="50" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <rect x="200" y="50" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <!-- Row 2 -->
    <rect x="0" y="100" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.28"/>
    <rect x="50" y="100" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.52"/>
    <rect x="100" y="100" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.78"/>
    <rect x="150" y="100" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <rect x="200" y="100" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <!-- Row 3 -->
    <rect x="0" y="150" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.22"/>
    <rect x="50" y="150" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.34"/>
    <rect x="100" y="150" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.60"/>
    <rect x="150" y="150" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.86"/>
    <rect x="200" y="150" width="44" height="44" rx="5" fill="#232B3A" stroke="#2F3A4F"/>
    <!-- Row 4 -->
    <rect x="0" y="200" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.18"/>
    <rect x="50" y="200" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.25"/>
    <rect x="100" y="200" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.40"/>
    <rect x="150" y="200" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.68"/>
    <rect x="200" y="200" width="44" height="44" rx="5" fill="#3B82F6" fill-opacity="0.90"/>

    <text x="172" y="26" fill="#64748B" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">-inf</text>
  </g>

  <line x1="392" y1="56" x2="392" y2="344" stroke="#2D3748" stroke-dasharray="4 4"/>

  <!-- Right panel: RoPE 2D Rotation -->
  <text x="440" y="68" fill="#4EC499" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1">ROPE RELATIVE ROTATION (m - n)θ</text>
  <g transform="translate(585, 222)">
    <circle cx="0" cy="0" r="98" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#334155" stroke-width="1.2"/>

    <!-- Vector q rotated by m*theta -->
    <line x1="0" y1="0" x2="82" y2="-54" stroke="#7DA9E8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="82" cy="-54" r="5" fill="#7DA9E8"/>
    <text x="92" y="-56" fill="#9EC0F2" font-family="ui-monospace, monospace" font-size="13">R(mθ)q</text>

    <!-- Vector k rotated by n*theta -->
    <line x1="0" y1="0" x2="28" y2="-94" stroke="#4EC499" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="-94" r="5" fill="#4EC499"/>
    <text x="38" y="-98" fill="#4EC499" font-family="ui-monospace, monospace" font-size="13">R(nθ)k</text>

    <!-- Angle arc -->
    <path d="M 42 -28 A 50 50 0 0 0 15 -48" stroke="#E6AB55" stroke-width="2" fill="none"/>
    <text x="44" y="-44" fill="#E6AB55" font-family="ui-monospace, monospace" font-size="12">(n-m)θ</text>
  </g>
</svg>
